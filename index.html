<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
body {
  margin: 0;
  background: #020b12;
  font-family: 'Segoe UI', sans-serif;
  color: #00eaff;
  overflow: hidden;
}

/* ===== FONDO ANIMADO ===== */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* ===== CONTENEDOR GENERAL ===== */
.container {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER ===== */
.header {
  text-align: center;
  padding: 15px;
  font-size: 28px;
  letter-spacing: 3px;
  text-shadow: 0 0 15px #00eaff;
}

/* ===== CHAT ===== */
.chat {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* MENSAJES */
.msg {
  max-width: 75%;
  padding: 12px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
}

.user {
  align-self: flex-end;
  background: #00eaff;
  color: #002;
  border-radius: 15px 15px 0 15px;
}

.bot {
  align-self: flex-start;
  background: rgba(0, 234, 255, 0.1);
  border: 1px solid #00eaff;
  border-radius: 15px 15px 15px 0;
}

/* ===== INPUT ===== */
.input-area {
  display: flex;
  padding: 10px;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(0, 234, 255, 0.1);
  color: #00eaff;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  background: #00eaff;
  color: #002;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 10px #00eaff;
}

/* ===== EFECTO ESCRITURA ===== */
.typing::after {
  content: "|";
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

  <div class="header">JARVIS AI</div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Hable, señor...">
    <button onclick="send()">➤</button>
  </div>

</div>

<script>

/* ===== FONDO TIPO REACTOR ===== */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    dx: (Math.random() - 0.5),
    dy: (Math.random() - 0.5)
  });
}

function draw() {
  ctx.fillStyle = "rgba(2,11,18,0.3)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "#00eaff";
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
  });

  requestAnimationFrame(draw);
}

draw();

/* ===== CHAT ===== */
const chat = document.getElementById("chat");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;

  if (type === "bot") {
    typingEffect(div, text);
  } else {
    div.innerText = text;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* ===== EFECTO ESCRITURA ===== */
function typingEffect(element, text) {
  let i = 0;
  element.classList.add("typing");

  function write() {
    if (i < text.length) {
      element.innerText += text.charAt(i);
      i++;
      setTimeout(write, 20);
    } else {
      element.classList.remove("typing");
    }
  }

  write();
}

/* ===== RESPUESTAS INTELIGENTES ===== */
function getResponse(msg) {
  msg = msg.toLowerCase();

  if (msg.includes("hola")) return "Saludos, señor.";
  if (msg.includes("hora")) return new Date().toLocaleTimeString();
  if (msg.includes("que haces")) return "Optimizando su tiempo, como siempre.";

  return "Interesante... continúe.";
}

/* ===== ENVIAR ===== */
function send() {
  const input = document.getElementById("input");
  const text = input.value;

  if (!text) return;

  addMessage(text, "user");

  setTimeout(() => {
    addMessage(getResponse(text), "bot");
  }, 400);

  input.value = "";
}

</script>

</body>
</html>
