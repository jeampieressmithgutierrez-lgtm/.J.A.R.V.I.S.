<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JARVIS Reactor 3D</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #02050a, #000);
}
canvas {
  display: block;
}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// ESCENA
const scene = new THREE.Scene();

// CÁMARA
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 6;

// RENDER
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LUCES
const light = new THREE.PointLight(0x00eaff, 3, 20);
light.position.set(0,0,3);
scene.add(light);

const ambient = new THREE.AmbientLight(0x222244);
scene.add(ambient);

// GRUPO DEL REACTOR
const reactor = new THREE.Group();
scene.add(reactor);

// ==========================
// NÚCLEO
// ==========================
const coreGeometry = new THREE.CircleGeometry(0.7, 6); // hexágono
const coreMaterial = new THREE.MeshBasicMaterial({
  color: 0xffffff
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
reactor.add(core);

// GLOW
const glowGeometry = new THREE.CircleGeometry(1.2, 32);
const glowMaterial = new THREE.MeshBasicMaterial({
  color: 0x00eaff,
  transparent: true,
  opacity: 0.4
});
const glow = new THREE.Mesh(glowGeometry, glowMaterial);
reactor.add(glow);

// ==========================
// ANILLOS METÁLICOS
// ==========================
function createRing(radius, thickness, color) {
  const geometry = new THREE.TorusGeometry(radius, thickness, 16, 100);
  const material = new THREE.MeshStandardMaterial({
    color: color,
    metalness: 0.9,
    roughness: 0.3
  });
  return new THREE.Mesh(geometry, material);
}

const ring1 = createRing(1.5, 0.05, 0x888888);
const ring2 = createRing(2.0, 0.04, 0xaaaaaa);

reactor.add(ring1);
reactor.add(ring2);

// ==========================
// FILAMENTOS (COBRE)
// ==========================
for (let i = 0; i < 8; i++) {
  const geo = new THREE.CylinderGeometry(0.02, 0.02, 1.5);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xff8800,
    emissive: 0xaa4400
  });

  const wire = new THREE.Mesh(geo, mat);
  wire.position.y = 0.75;
  wire.rotation.z = Math.PI / 2;

  const pivot = new THREE.Group();
  pivot.rotation.z = (i * Math.PI) / 4;
  pivot.add(wire);

  reactor.add(pivot);
}

// ==========================
// ANIMACIÓN
// ==========================
let time = 0;

function animate() {
  requestAnimationFrame(animate);

  time += 0.02;

  // ROTACIÓN 3D REAL
  reactor.rotation.y += 0.01;
  reactor.rotation.x += 0.005;

  // PULSO DE LUZ
  const pulse = 1 + Math.sin(time * 2) * 0.1;
  glow.scale.set(pulse, pulse, pulse);

  renderer.render(scene, camera);
}

animate();

// RESPONSIVE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
