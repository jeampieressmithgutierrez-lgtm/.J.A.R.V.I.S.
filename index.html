<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #1a0d00 0%, #000000 70%);
    color: #FFD36B;
    overflow: hidden;
}

/* EFECTO FONDO (ENERGÍA) */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,180,0,0.15) 0%, transparent 60%);
    animation: pulse 4s infinite;
    z-index: 0;
}

@keyframes pulse {
    0% { opacity: 0.3; }
    50% { opacity: 0.6; }
    100% { opacity: 0.3; }
}

/* CONTENEDOR */
.container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

/* HEADER PRO */
h1 {
    text-align: center;
    letter-spacing: 3px;
    color: #FFC857;
    text-shadow: 
        0 0 10px rgba(255,200,0,0.8),
        0 0 20px rgba(255,140,0,0.6);
}

/* CHAT */
#chat {
    height: 70vh;
    overflow-y: auto;
    padding: 15px;
    border-radius: 15px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,180,0,0.2);
    box-shadow: 0 0 30px rgba(255,140,0,0.15);
}

/* MENSAJES */
.message {
    margin: 10px 0;
    padding: 12px;
    border-radius: 12px;
    max-width: 80%;
}

/* USUARIO */
.user {
    background: linear-gradient(135deg, #FFD36B, #FFB300);
    color: #000;
    margin-left: auto;
    box-shadow: 0 0 10px rgba(255,180,0,0.5);
}

/* JARVIS */
.bot {
    background: rgba(255,180,0,0.08);
    border-left: 3px solid #FFC857;
    box-shadow: 0 0 10px rgba(255,140,0,0.2);
}

/* INPUT */
.input-area {
    display: flex;
    margin-top: 10px;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
    background: rgba(0,0,0,0.6);
    color: #FFD36B;
    box-shadow: inset 0 0 10px rgba(255,180,0,0.2);
}

/* BOTÓN */
button {
    padding: 12px 18px;
    background: linear-gradient(135deg, #FFD36B, #FFB300);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(255,180,0,0.5);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(255,180,0,0.9);
}

/* 📱 CELULAR */
@media (max-width: 600px) {
    #chat {
        height: 75vh;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>JARVIS AI</h1>

    <div id="chat"></div>

    <div class="input-area">
        <input id="input" placeholder="Hable, señor...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const message = input.value.trim();
    if (!message) return;

    chat.innerHTML += `<div class="message user">${message}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message})
    });

    const data = await response.json();

    chat.innerHTML += `<div class="message bot">${data.reply}</div>`;
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
