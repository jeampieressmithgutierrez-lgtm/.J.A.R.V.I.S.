<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1a1200, #000000 80%);
    color: #FFD700;
}

/* HEADER */
.header {
    text-align: center;
    font-size: 26px;
    padding: 15px;
    letter-spacing: 3px;
    font-weight: bold;
    background: linear-gradient(to right, transparent, rgba(255,215,0,0.1), transparent);
    border-bottom: 1px solid rgba(255,215,0,0.2);
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
}

/* CONTENEDOR */
.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

/* CHAT */
#chat {
    height: 70vh;
    overflow-y: auto;
    padding: 15px;
    border-radius: 15px;
    background: rgba(255, 215, 0, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,215,0,0.2);
    box-shadow: 0 0 25px rgba(255,215,0,0.1);
}

/* MENSAJES */
.message {
    margin: 10px 0;
    padding: 12px 15px;
    border-radius: 15px;
    max-width: 80%;
    line-height: 1.5;
    animation: fadeIn 0.3s ease-in-out;
}

/* USUARIO */
.user {
    background: linear-gradient(135deg, #FFD700, #ffcc00);
    color: #000;
    margin-left: auto;
    text-align: right;
    box-shadow: 0 0 10px rgba(255,215,0,0.4);
}

/* JARVIS */
.bot {
    background: rgba(255, 215, 0, 0.08);
    border-left: 3px solid #FFD700;
    backdrop-filter: blur(6px);
}

/* INPUT */
.input-area {
    display: flex;
    margin-top: 12px;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,215,0,0.2);
    outline: none;
    font-size: 16px;
    background: rgba(0,0,0,0.6);
    color: #FFD700;
}

/* BOTÓN */
button {
    padding: 12px 18px;
    background: linear-gradient(135deg, #FFD700, #ffcc00);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(255,215,0,0.5);
}

button:hover {
    transform: scale(1.05);
}

/* ANIMACIÓN */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(5px);}
    to {opacity: 1; transform: translateY(0);}
}

/* 📱 CELULAR */
@media (max-width: 600px) {
    .header {
        font-size: 20px;
    }

    #chat {
        height: 75vh;
    }

    .message {
        max-width: 90%;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="header">JARVIS AI</div>

<div class="container">

    <div id="chat"></div>

    <div class="input-area">
        <input id="input" placeholder="Hable, señor...">
        <button onclick="sendMessage()">Enviar</button>
    </div>

</div>

<script>
async function sendMessage() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const message = input.value.trim();
    if (!message) return;

    // Mensaje usuario
    chat.innerHTML += `<div class="message user">${message}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    // Simulación escribiendo
    const typing = document.createElement("div");
    typing.className = "message bot";
    typing.innerText = "Escribiendo...";
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message})
    });

    const data = await response.json();

    // Quitar "Escribiendo..."
    chat.removeChild(typing);

    // Mensaje bot
    chat.innerHTML += `<div class="message bot">${data.reply}</div>`;
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
