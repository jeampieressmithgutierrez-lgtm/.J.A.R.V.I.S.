<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #020b12;
  overflow: hidden;
  color: #00f0ff;
}

/* FONDO PARTÍCULAS */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* REACTOR CENTRAL */
.reactor {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 200px;
  height: 200px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, #00f0ff 0%, #001a22 60%, transparent 70%);
  box-shadow: 0 0 40px #00f0ff, inset 0 0 30px #00f0ff;
  animation: pulse 2s infinite ease-in-out;
  z-index: 1;
}

@keyframes pulse {
  0%,100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
  50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
}

/* CHAT */
.chat {
  position: absolute;
  bottom: 80px;
  width: 100%;
  padding: 10px;
  z-index: 2;
}

.bubble {
  max-width: 70%;
  padding: 10px;
  margin: 5px;
  border-radius: 15px;
}

.user {
  background: #00f0ff;
  color: #000;
  margin-left: auto;
}

.bot {
  border: 1px solid #00f0ff;
}

/* INPUT */
.input-area {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  padding: 10px;
  background: rgba(0,20,30,0.8);
  backdrop-filter: blur(10px);
  z-index: 3;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 12px 18px;
  border: none;
  border-radius: 20px;
  background: #00f0ff;
}

/* EFECTO ESCRITURA */
.typing::after {
  content: "|";
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,50%,100% { opacity: 1; }
  25%,75% { opacity: 0; }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="reactor"></div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="Hable, señor...">
  <button onclick="send()">➤</button>
</div>

<script>
const chat = document.getElementById("chat");

function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(() => {
    typeMessage("Saludos, señor.", "bot");
  }, 500);
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "bubble " + type;
  div.textContent = text;
  chat.appendChild(div);
}

function typeMessage(text, type) {
  const div = document.createElement("div");
  div.className = "bubble " + type + " typing";
  chat.appendChild(div);

  let i = 0;
  const interval = setInterval(() => {
    div.textContent = text.substring(0, i);
    i++;
    if (i > text.length) {
      clearInterval(interval);
      div.classList.remove("typing");
    }
  }, 30);
}

/* PARTÍCULAS */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    dx: (Math.random() - 0.5),
    dy: (Math.random() - 0.5)
  });
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = "#00f0ff";
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if(p.x<0||p.x>canvas.width) p.dx *= -1;
    if(p.y<0||p.y>canvas.height) p.dy *= -1;
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
