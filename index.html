<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>JARVIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle, #0f2027, #000000);
      color: #00ffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .mensaje {
      max-width: 70%;
      padding: 10px;
      margin: 10px;
      border-radius: 15px;
    }

    .usuario {
      background: #00ffff;
      color: black;
      align-self: flex-end;
    }

    .ia {
      border: 1px solid #00ffff;
      align-self: flex-start;
    }

    .input-container {
      display: flex;
      padding: 10px;
      background: #111;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 50%;
      background: #00ffff;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="chat-container" id="chat"></div>

  <div class="input-container">
    <input id="input" type="text" placeholder="Hable, señor..." />
    <button onclick="enviar()">➤</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    function agregarMensaje(texto, tipo) {
      const div = document.createElement("div");
      div.classList.add("mensaje", tipo);
      div.innerText = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function enviar() {
      const mensaje = input.value.trim();
      if (!mensaje) return;

      agregarMensaje(mensaje, "usuario");
      input.value = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: mensaje })
        });

        const data = await res.json();

        console.log("Respuesta IA:", data);

        // ✔ IMPORTANTE: usar EXACTAMENTE "response"
        agregarMensaje(data.response || "Sin respuesta del servidor.", "ia");

      } catch (error) {
        console.error(error);
        agregarMensaje("Error al conectar con el servidor.", "ia");
      }
    }

    // Enviar con ENTER
    input.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        enviar();
      }
    });
  </script>

</body>
</html>
