<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>J.A.R.V.I.S</title>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle, #02040a, #000000);
      font-family: Arial, sans-serif;
      color: #cfefff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* TÍTULO METÁLICO */
    .title {
      margin-top: 30px;
      font-size: 28px;
      letter-spacing: 6px;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(90deg, #0a1f3c, #9fb3c8, #0a1f3c);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 10px rgba(0,180,255,0.6);
    }

    /* CHAT */
    .chat {
      width: 90%;
      max-width: 500px;
      margin-top: 20px;
    }

    .message {
      padding: 10px;
      margin: 10px 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user {
      background: #0a1a2f;
      justify-content: flex-end;
    }

    .jarvis {
      background: #03111f;
      border: 1px solid #0ff;
    }

    /* TRIÁNGULO ARC REACTOR */
    .arc {
      width: 20px;
      height: 20px;
      background: cyan;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      box-shadow: 0 0 10px cyan;
    }

    /* INPUT */
    .input-area {
      position: fixed;
      bottom: 10px;
      width: 90%;
      max-width: 500px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #02101d;
      color: white;
    }

    button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: cyan;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- TÍTULO -->
  <div class="title">J.A.R.V.I.S</div>

  <!-- CHAT -->
  <div class="chat" id="chat"></div>

  <!-- INPUT -->
  <div class="input-area">
    <input type="text" id="input" placeholder="Escriba, Señor...">
    <button onclick="send()">Enviar</button>
  </div>

  <script>
    function send() {
      let input = document.getElementById("input");
      let chat = document.getElementById("chat");

      if (input.value.trim() === "") return;

      // Mensaje usuario
      chat.innerHTML += `
        <div class="message user">
          <span>${input.value}</span>
        </div>
      `;

      // Respuesta Jarvis
      setTimeout(() => {
        chat.innerHTML += `
          <div class="message jarvis">
            <div class="arc"></div>
            <span>Procesando, Señor...</span>
          </div>
        `;
        chat.scrollTop = chat.scrollHeight;
      }, 500);

      input.value = "";
    }
  </script>

</body>
</html>
