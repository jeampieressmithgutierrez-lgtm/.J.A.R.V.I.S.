<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at center, #02050a, #000);
  color: #00eaff;
  overflow: hidden;
}

/* FONDO GRID */
.background-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(#00eaff22 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}

/* CONTENEDOR */
.container {
  width: 900px;
  height: 90vh;
  margin: auto;
  margin-top: 3vh;
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 15px;
  box-shadow: 0 0 30px rgba(0,255,255,0.2);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(10px);
  background: rgba(0,10,20,0.6);
  position: relative;
  z-index: 2;
}

/* HEADER */
.header {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  letter-spacing: 6px;
  font-weight: bold;
  color: #cfefff;
  text-shadow: 0 0 10px #00eaff;
}

/* CHAT */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* MENSAJES */
.mensaje {
  max-width: 60%;
  padding: 12px;
  margin: 10px;
  border-radius: 10px;
}

.usuario {
  margin-left: auto;
  background: rgba(0,255,255,0.1);
  border: 1px solid #00eaff;
}

.ia {
  background: rgba(0,100,255,0.1);
  border: 1px solid #00eaff;
}

/* INPUT */
.input-area {
  display: flex;
  padding: 10px;
  border-top: 1px solid rgba(0,255,255,0.2);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #02131f;
  color: #00eaff;
}

button {
  margin-left: 10px;
  border: none;
  border-radius: 50%;
  padding: 12px;
  background: #00eaff;
  cursor: pointer;
}

/* CURSOR */
.typing::after {
  content: "▋";
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,100% { opacity: 0; }
  50% { opacity: 1; }
}

/* CANVAS 3D */
canvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
}
</style>
</head>

<body>

<div class="background-grid"></div>

<div class="container">
  <div class="header">J.A.R.V.I.S</div>
  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Hable, señor...">
    <button onclick="enviar()">➤</button>
  </div>
</div>

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

<script>
// ================= CHAT =================
const chat = document.getElementById("chat");
const input = document.getElementById("input");

let enviando = false;

function agregarMensaje(texto, tipo) {
  const div = document.createElement("div");
  div.classList.add("mensaje", tipo);
  div.innerText = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escribirTexto(elemento, texto, velocidad = 20) {
  elemento.innerText = "";
  elemento.classList.add("typing");

  let i = 0;
  function escribir() {
    if (i < texto.length) {
      elemento.innerText += texto.charAt(i);
      i++;
      setTimeout(escribir, velocidad);
    } else {
      elemento.classList.remove("typing");
    }
  }
  escribir();
}

async function enviar() {
  if (enviando) return;
  enviando = true;

  const mensaje = input.value.trim();
  if (!mensaje) {
    enviando = false;
    return;
  }

  agregarMensaje(mensaje, "usuario");
  input.value = "";

  const mensajeIA = agregarMensaje("", "ia");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: mensaje })
    });

    const data = await res.json();
    escribirTexto(mensajeIA, data.reply || "Sin respuesta.");
  } catch {
    mensajeIA.innerText = "Error de conexión.";
  }

  enviando = false;
}

input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") enviar();
});

// ================= REACTOR 3D =================

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LUCES
const light = new THREE.PointLight(0x00eaff, 3, 100);
light.position.set(0, 0, 10);
scene.add(light);

scene.add(new THREE.AmbientLight(0x222244));

// NÚCLEO
const core = new THREE.Mesh(
  new THREE.SphereGeometry(1.2, 32, 32),
  new THREE.MeshStandardMaterial({
    color: 0x00eaff,
    emissive: 0x00eaff,
    emissiveIntensity: 2
  })
);
scene.add(core);

// ANILLOS
const ring1 = new THREE.Mesh(
  new THREE.TorusGeometry(3, 0.2, 16, 100),
  new THREE.MeshStandardMaterial({
    color: 0x00eaff,
    emissive: 0x0088ff
  })
);
scene.add(ring1);

const ring2 = new THREE.Mesh(
  new THREE.TorusGeometry(2, 0.1, 16, 100),
  new THREE.MeshStandardMaterial({
    color: 0x00eaff,
    emissive: 0x00eaff
  })
);
ring2.rotation.x = Math.PI / 2;
scene.add(ring2);

camera.position.z = 8;

// ANIMACIÓN
function animate() {
  requestAnimationFrame(animate);

  ring1.rotation.z += 0.01;
  ring2.rotation.x += 0.015;

  core.material.emissiveIntensity =
    1.5 + Math.sin(Date.now() * 0.005) * 0.5;

  renderer.render(scene, camera);
}

animate();

// RESPONSIVE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
