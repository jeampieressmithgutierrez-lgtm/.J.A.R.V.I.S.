<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #300000, #000000 80%);
    color: #FFD700;
}

/* CONTENEDOR */
.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

/* TÍTULO */
h1 {
    text-align: center;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff0000;
}

/* CHAT */
#chat {
    height: 70vh;
    overflow-y: auto;
    padding: 10px;
    border: 1px solid rgba(255, 215, 0, 0.2);
    border-radius: 10px;
    background: rgba(0,0,0,0.6);
    box-shadow: 0 0 20px rgba(255,0,0,0.2);
}

/* MENSAJES */
.message {
    margin: 10px 0;
    padding: 12px;
    border-radius: 12px;
    max-width: 80%;
    line-height: 1.4;
}

/* USUARIO */
.user {
    background: #FFD700;
    color: #000;
    margin-left: auto;
    text-align: right;
}

/* JARVIS */
.bot {
    background: rgba(255, 0, 0, 0.15);
    border-left: 3px solid #ff0000;
}

/* INPUT */
.input-area {
    display: flex;
    margin-top: 10px;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
    background: #111;
    color: #FFD700;
}

/* BOTÓN */
button {
    padding: 12px 18px;
    background: #FFD700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* EFECTO HOVER */
button:hover {
    background: #ffcc00;
}

/* 📱 MODO CELULAR */
@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    h1 {
        font-size: 18px;
    }

    #chat {
        height: 75vh;
        padding: 8px;
    }

    .message {
        max-width: 90%;
        font-size: 14px;
    }

    input {
        font-size: 14px;
        padding: 10px;
    }

    button {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>JARVIS AI</h1>

    <div id="chat"></div>

    <div class="input-area">
        <input id="input" placeholder="Hable, señor...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const message = input.value.trim();
    if (!message) return;

    // Mensaje usuario
    chat.innerHTML += `<div class="message user">${message}</div>`;
    input.value = "";

    // Scroll automático
    chat.scrollTop = chat.scrollHeight;

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message})
    });

    const data = await response.json();

    // Mensaje bot
    chat.innerHTML += `<div class="message bot">${data.reply}</div>`;
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
