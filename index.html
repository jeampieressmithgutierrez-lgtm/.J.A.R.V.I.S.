<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at center, #02050a, #000);
  color: #00eaff;
  overflow: hidden;
}

/* GRID */
.background-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(#00eaff22 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}

/* CONTENEDOR */
.container {
  width: 900px;
  height: 90vh;
  margin: auto;
  margin-top: 3vh;
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 15px;
  box-shadow: 0 0 30px rgba(0,255,255,0.2);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(10px);
  background: rgba(0,10,20,0.6);
  position: relative;
  z-index: 2;
}

/* HEADER */
.header {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  letter-spacing: 6px;
  font-weight: bold;
  color: #cfefff;
  text-shadow: 0 0 10px #00eaff;
}

/* CHAT */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* MENSAJES */
.mensaje {
  max-width: 60%;
  padding: 12px;
  margin: 10px;
  border-radius: 10px;
}

.usuario {
  margin-left: auto;
  background: rgba(0,255,255,0.1);
  border: 1px solid #00eaff;
}

.ia {
  background: rgba(0,100,255,0.1);
  border: 1px solid #00eaff;
}

/* INPUT */
.input-area {
  display: flex;
  padding: 10px;
  border-top: 1px solid rgba(0,255,255,0.2);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #02131f;
  color: #00eaff;
}

button {
  margin-left: 10px;
  border: none;
  border-radius: 50%;
  padding: 12px;
  background: #00eaff;
  cursor: pointer;
}

/* CURSOR */
.typing::after {
  content: "▋";
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,100% { opacity: 0; }
  50% { opacity: 1; }
}

/* CANVAS 3D */
canvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
}
</style>
</head>

<body>

<div class="background-grid"></div>

<div class="container">
  <div class="header">J.A.R.V.I.S</div>
  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Hable, señor...">
    <button onclick="enviar()">➤</button>
  </div>
</div>

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

<script>
// ================= CHAT =================
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function agregarMensaje(texto, tipo) {
  const div = document.createElement("div");
  div.classList.add("mensaje", tipo);
  div.innerText = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escribirTexto(elemento, texto, velocidad = 20) {
  elemento.innerText = "";
  elemento.classList.add("typing");

  let i = 0;
  function escribir() {
    if (i < texto.length) {
      elemento.innerText += texto.charAt(i);
      i++;
      setTimeout(escribir, velocidad);
    } else {
      elemento.classList.remove("typing");
    }
  }
  escribir();
}

// RESPUESTA LOCAL (SIN SERVIDOR)
function respuestaIA(msg) {
  return "Procesando: " + msg;
}

function enviar() {
  const mensaje = input.value.trim();
  if (!mensaje) return;

  agregarMensaje(mensaje, "usuario");
  input.value = "";

  const mensajeIA = agregarMensaje("", "ia");
  escribirTexto(mensajeIA, respuestaIA(mensaje));
}

input.addEventListener("keypress", e => {
  if (e.key === "Enter") enviar();
});

// ================= REACTOR ARC 3D =================

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LUCES
const light = new THREE.PointLight(0x00eaff, 4, 100);
light.position.set(0, 0, 10);
scene.add(light);

scene.add(new THREE.AmbientLight(0x111122));

// NÚCLEO
const core = new THREE.Mesh(
  new THREE.SphereGeometry(1.2, 64, 64),
  new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0x00eaff,
    emissiveIntensity: 3
  })
);
scene.add(core);

// ANILLO EXTERNO
const outerRing = new THREE.Mesh(
  new THREE.TorusGeometry(4, 0.25, 32, 200),
  new THREE.MeshStandardMaterial({
    color: 0x888888,
    metalness: 1,
    roughness: 0.3
  })
);
scene.add(outerRing);

// ANILLO INTERNO
const innerRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.5, 0.15, 32, 200),
  new THREE.MeshStandardMaterial({
    color: 0x00eaff,
    emissive: 0x00eaff,
    emissiveIntensity: 1
  })
);
scene.add(innerRing);

// BRAZOS
for (let i = 0; i < 6; i++) {
  const angle = (i / 6) * Math.PI * 2;

  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 3, 0.3),
    new THREE.MeshStandardMaterial({
      color: 0xaaaaaa,
      metalness: 1,
      roughness: 0.4
    })
  );

  arm.position.x = Math.cos(angle) * 2.5;
  arm.position.y = Math.sin(angle) * 2.5;
  arm.rotation.z = angle;

  scene.add(arm);
}

// FILAMENTOS
for (let i = 0; i < 12; i++) {
  const angle = (i / 12) * Math.PI * 2;

  const filament = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.05, 4, 16),
    new THREE.MeshStandardMaterial({
      color: 0xffaa33,
      emissive: 0xff8800,
      emissiveIntensity: 1.5
    })
  );

  filament.rotation.z = Math.PI / 2;
  filament.position.x = Math.cos(angle) * 1.8;
  filament.position.y = Math.sin(angle) * 1.8;

  scene.add(filament);
}

camera.position.z = 10;

// ANIMACIÓN
function animate() {
  requestAnimationFrame(animate);

  outerRing.rotation.z += 0.01;
  innerRing.rotation.x += 0.015;
  scene.rotation.z += 0.002;

  core.material.emissiveIntensity =
    2 + Math.sin(Date.now() * 0.004) * 0.5;

  renderer.render(scene, camera);
}

animate();

// RESPONSIVE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
