<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #001018, #000);
    font-family: Arial, sans-serif;
    color: #00f7ff;
    overflow: hidden;
}

/* HEADER */
.header {
    text-align: center;
    padding: 15px;
    font-size: 22px;
    letter-spacing: 5px;
    text-shadow: 0 0 10px #00f7ff;
}

/* PARTICULAS */
canvas {
    position: absolute;
    top: 0;
    left: 0;
}

/* REACTOR */
.arc-reactor {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 180px;
    height: 180px;
    border-radius: 50%;
    box-shadow: 
        0 0 40px #00f7ff,
        inset 0 0 30px #00f7ff;
    animation: pulse 2s infinite;
}

.arc-reactor::before {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    top: 30px;
    left: 30px;
    border-radius: 50%;
    border: 3px solid #00f7ff;
    animation: spin 4s linear infinite;
}

.arc-reactor::after {
    content: "";
    position: absolute;
    width: 60px;
    height: 60px;
    top: 60px;
    left: 60px;
    border-radius: 50%;
    background: #00f7ff;
    box-shadow: 0 0 20px #00f7ff;
}

/* ANIMACIONES */
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes pulse {
    0%,100% { box-shadow: 0 0 30px #00f7ff; }
    50% { box-shadow: 0 0 60px #00f7ff; }
}

/* CHAT */
.chat {
    position: absolute;
    bottom: 80px;
    width: 100%;
    max-height: 40%;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    margin: 8px;
    padding: 10px;
    border-radius: 15px;
    max-width: 70%;
}

.user {
    background: #00f7ff;
    color: black;
    margin-left: auto;
}

.jarvis {
    border: 1px solid #00f7ff;
}

/* INPUT */
.input-box {
    position: absolute;
    bottom: 20px;
    width: 90%;
    left: 5%;
    display: flex;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: none;
}

button {
    margin-left: 10px;
    border: none;
    background: #00f7ff;
    border-radius: 50%;
    width: 45px;
}
</style>
</head>

<body>

<div class="header">J.A.R.V.I.S.</div>

<canvas id="particles"></canvas>

<div class="arc-reactor"></div>

<div class="chat" id="chat"></div>

<div class="input-box">
    <input id="input" placeholder="Hable, señor...">
    <button onclick="send()">➤</button>
</div>

<script>
// PARTICULAS
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for (let i = 0; i < 60; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2
    });
}

function drawParticles() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#00f7ff";
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();

        p.y -= 0.3;
        if (p.y < 0) p.y = canvas.height;
    });
    requestAnimationFrame(drawParticles);
}
drawParticles();

// CHAT
function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    addMsg(text, "user");
    input.value = "";

    setTimeout(() => {
        addMsg(responder(text), "jarvis");
    }, 500);
}

function addMsg(text, type) {
    const chat = document.getElementById("chat");
    const msg = document.createElement("div");

    msg.className = "msg " + type;
    msg.innerText = text;

    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
}

// RESPUESTAS INTELIGENTES (arreglado bug repetición)
function responder(texto) {
    texto = texto.toLowerCase();

    if (texto.includes("hola")) return "Buenas, señor.";
    if (texto.includes("que haces")) return "Operando al 100%, como siempre.";
    if (texto.includes("clima")) return "Procesando datos climáticos...";
    if (texto.includes("reactor")) return "El reactor Arc es una fuente de energía avanzada.";

    return "Interesante... continúe.";
}
</script>

</body>
</html>
