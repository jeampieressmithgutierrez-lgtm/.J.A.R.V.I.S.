<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at center, #02050a, #000);
  color: #00eaff;
  overflow: hidden;
}

/* GRID */
.background-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(#00eaff22 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}

/* CONTENEDOR */
.container {
  width: 900px;
  height: 90vh;
  margin: auto;
  margin-top: 3vh;
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 15px;
  box-shadow: 0 0 30px rgba(0,255,255,0.2);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(10px);
  background: rgba(0,10,20,0.6);
  position: relative;
  z-index: 2;
}

/* HEADER */
.header {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  letter-spacing: 6px;
  font-weight: bold;
  color: #cfefff;
  text-shadow: 0 0 10px #00eaff;
}

/* CHAT */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* MENSAJES */
.mensaje {
  max-width: 60%;
  padding: 12px;
  margin: 10px;
  border-radius: 10px;
}

.usuario {
  margin-left: auto;
  background: rgba(0,255,255,0.1);
  border: 1px solid #00eaff;
}

.ia {
  background: rgba(0,100,255,0.1);
  border: 1px solid #00eaff;
}

/* INPUT */
.input-area {
  display: flex;
  padding: 10px;
  border-top: 1px solid rgba(0,255,255,0.2);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #02131f;
  color: #00eaff;
}

button {
  margin-left: 10px;
  border: none;
  border-radius: 50%;
  padding: 12px;
  background: #00eaff;
  cursor: pointer;
}

/* CURSOR */
.typing::after {
  content: "▋";
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,100% { opacity: 0; }
  50% { opacity: 1; }
}

/* CANVAS 3D */
canvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
}
</style>
</head>

<body>

<div class="background-grid"></div>

<div class="container">
  <div class="header">J.A.R.V.I.S</div>
  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Hable, señor...">
    <button onclick="enviar()">➤</button>
  </div>
</div>

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

<script>
// ================= CHAT =================
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function agregarMensaje(texto, tipo) {
  const div = document.createElement("div");
  div.classList.add("mensaje", tipo);
  div.innerText = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escribirTexto(elemento, texto, velocidad = 20) {
  elemento.innerText = "";
  elemento.classList.add("typing");

  let i = 0;
  function escribir() {
    if (i < texto.length) {
      elemento.innerText += texto.charAt(i);
      i++;
      setTimeout(escribir, velocidad);
    } else {
      elemento.classList.remove("typing");
    }
  }
  escribir();
}

// RESPUESTA LOCAL (SIN SERVIDOR)
function respuestaIA(msg) {
  return "Procesando: " + msg;
}

function enviar() {
  const mensaje = input.value.trim();
  if (!mensaje) return;

  agregarMensaje(mensaje, "usuario");
  input.value = "";

  const mensajeIA = agregarMensaje("", "ia");
  escribirTexto(mensajeIA, respuestaIA(mensaje));
}

input.addEventListener("keypress", e => {
  if (e.key === "Enter") enviar();
});

// ================= REACTOR ARC 3D (MEJORADO) =================

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; 
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// --- ILUMINACIÓN AVANZADA ---
const ambientLight = new THREE.AmbientLight(0x0a1520, 1.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5, 5, 5);
scene.add(dirLight);

const reactorLight = new THREE.PointLight(0x00f0ff, 5, 15);
reactorLight.position.set(0, 0, 1);
scene.add(reactorLight);

// --- MATERIALES REALISTAS ---
const chromeMaterial = new THREE.MeshStandardMaterial({
  color: 0xdddddd,
  metalness: 0.9,
  roughness: 0.15
});

const copperMaterial = new THREE.MeshStandardMaterial({
  color: 0xd47a2a,
  metalness: 0.8,
  roughness: 0.3
});

const darkMetalMaterial = new THREE.MeshStandardMaterial({
  color: 0x222222,
  metalness: 0.8,
  roughness: 0.5
});

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x99f6ff,
  transparent: true,
  opacity: 0.4,
  roughness: 0.1,
  transmission: 0.6, 
  thickness: 0.5
});

const glowMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  emissive: 0x00eaff,
  emissiveIntensity: 4
});

// --- CONSTRUCCIÓN DEL REACTOR ARC ---
const arcReactorGroup = new THREE.Group();

// 1. Núcleo Central de Energía
const coreGlow = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.15, 16, 100), glowMaterial);
arcReactorGroup.add(coreGlow);

const coreGlass = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.2, 16, 100), glassMaterial);
arcReactorGroup.add(coreGlass);

// 2. Anillo de Soporte Trasero
const baseRing = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.15, 16, 100), darkMetalMaterial);
baseRing.position.z = -0.3;
arcReactorGroup.add(baseRing);

// 3. El Anillo Principal de Cobre
const mainRing = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.25, 32, 100), copperMaterial);
arcReactorGroup.add(mainRing);

// 4. Bobinas / Segmentos de Cobre Alrededor del Anillo (10 piezas)
const totalSegments = 10;
for (let i = 0; i < totalSegments; i++) {
  const angle = (i / totalSegments) * Math.PI * 2;
  const segmentGroup = new THREE.Group();

  const wireBlock = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.6), copperMaterial);
  wireBlock.position.set(Math.cos(angle) * 2.2, Math.sin(angle) * 2.2, 0);
  wireBlock.rotation.z = angle;
  segmentGroup.add(wireBlock);

  const clamp = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.7), chromeMaterial);
  clamp.position.set(Math.cos(angle) * 2.2, Math.sin(angle) * 2.2, 0.05);
  clamp.rotation.z = angle;
  segmentGroup.add(clamp);

  arcReactorGroup.add(segmentGroup);
}

// 5. Malla y Brazos Estructurales Internos
const innerStarSegments = 3;
for (let i = 0; i < innerStarSegments; i++) {
  const angle = (i / innerStarSegments) * Math.PI * 2;
  
  const metalArm = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.12, 0.15), chromeMaterial);
  metalArm.position.set(Math.cos(angle) * 0.7, Math.sin(angle) * 0.7, -0.1);
  metalArm.rotation.z = angle;
  arcReactorGroup.add(metalArm);
}

// 6. Aro de Protección Cromado Superior
const topRim = new THREE.Mesh(new THREE.TorusGeometry(2.45, 0.06, 16, 100), chromeMaterial);
topRim.position.z = 0.25;
arcReactorGroup.add(topRim);

scene.add(arcReactorGroup);

// Posición de la cámara e inclinación inicial
camera.position.z = 7;
arcReactorGroup.rotation.x = 0.3; 
arcReactorGroup.rotation.y = -0.2;

// --- ANIMACIÓN ---
function animate() {
  requestAnimationFrame(animate);

  // Rotación fluida tridimensional
  arcReactorGroup.rotation.z += 0.005;

  // Bamboleo sutil para resaltar la profundidad
  arcReactorGroup.rotation.y = -0.2 + Math.sin(Date.now() * 0.001) * 0.05;

  // Brillo pulsante azul
  const pulse = 3 + Math.sin(Date.now() * 0.005) * 1.2;
  glowMaterial.emissiveIntensity = pulse;
  reactorLight.intensity = pulse * 1.5;

  renderer.render(scene, camera);
}

animate();

// --- RESPONSIVE ---
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
