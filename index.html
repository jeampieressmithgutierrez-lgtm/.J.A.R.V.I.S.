<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at center, #02050a, #000);
  color: #00eaff;
  overflow: hidden;
}

/* CONTENEDOR */
.container {
  width: 900px;
  height: 90vh;
  margin: auto;
  margin-top: 3vh;
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 15px;
  box-shadow: 0 0 30px rgba(0,255,255,0.2);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(10px);
  background: rgba(0,10,20,0.6);
}

/* HEADER */
.header {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  letter-spacing: 6px;
  font-weight: bold;
  color: #cfefff;
  text-shadow: 0 0 10px #00eaff;
}

/* CHAT */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* MENSAJES */
.mensaje {
  max-width: 60%;
  padding: 12px;
  margin: 10px;
  border-radius: 10px;
  position: relative;
  white-space: pre-wrap;
}

/* USUARIO */
.usuario {
  margin-left: auto;
  background: rgba(0,255,255,0.1);
  border: 1px solid #00eaff;
}

/* IA */
.ia {
  background: rgba(0,100,255,0.1);
  border: 1px solid #00eaff;
}

/* INPUT */
.input-area {
  display: flex;
  padding: 10px;
  border-top: 1px solid rgba(0,255,255,0.2);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #02131f;
  color: #00eaff;
}

button {
  margin-left: 10px;
  border: none;
  border-radius: 50%;
  padding: 12px;
  background: #00eaff;
  cursor: pointer;
}

/* REACTOR */
.reactor {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, #00eaff, transparent);
  box-shadow: 0 0 40px #00eaff;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: translateX(-50%) scale(1); }
  50% { transform: translateX(-50%) scale(1.1); }
  100% { transform: translateX(-50%) scale(1); }
}

/* GRID */
.background-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(#00eaff22 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: -1;
}

/* EFECTO ESCRIBIENDO */
.typing::after {
  content: "▋";
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,100% { opacity: 0; }
  50% { opacity: 1; }
}
</style>
</head>

<body>

<div class="background-grid"></div>

<div class="container">
  <div class="header">J.A.R.V.I.S</div>
  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Hable, señor...">
    <button onclick="enviar()">➤</button>
  </div>
</div>

<div class="reactor"></div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

let enviando = false;

function agregarMensaje(texto, tipo) {
  const div = document.createElement("div");
  div.classList.add("mensaje", tipo);
  div.innerText = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// ✨ EFECTO ESCRITURA REAL
function escribirTexto(elemento, texto, velocidad = 20) {
  elemento.innerText = "";
  elemento.classList.add("typing");

  let i = 0;
  function escribir() {
    if (i < texto.length) {
      elemento.innerText += texto.charAt(i);
      i++;
      setTimeout(escribir, velocidad);
    } else {
      elemento.classList.remove("typing");
    }
  }
  escribir();
}

async function enviar() {
  if (enviando) return;
  enviando = true;

  const mensaje = input.value.trim();
  if (!mensaje) {
    enviando = false;
    return;
  }

  agregarMensaje(mensaje, "usuario");
  input.value = "";

  const mensajeIA = agregarMensaje("", "ia");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: mensaje })
    });

    const data = await res.json();

    // ✅ CORRECCIÓN CLAVE AQUÍ
    const texto = data.reply || "Sin respuesta.";

    escribirTexto(mensajeIA, texto);

  } catch {
    mensajeIA.innerText = "Error de conexión.";
  }

  enviando = false;
}

input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") enviar();
});
</script>

</body>
</html>
