<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #00ffff;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 🌐 FONDO TECNOLÓGICO */
.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background: radial-gradient(circle at center, #001a2a, #000 70%);
  overflow: hidden;
}

/* 🔵 CIRCUITOS */
.bg::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(0,255,255,0.08) 1px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(0,255,255,0.06) 1px, transparent 1px),
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size: 80px 80px;
  animation: moveGrid 20s linear infinite;
  opacity: 0.4;
}

@keyframes moveGrid {
  0% { transform: translate(0,0); }
  100% { transform: translate(-80px,-80px); }
}

/* 🔵 REACTOR ARC */
.reactor {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 220px;
  height: 220px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 2px solid rgba(0,255,255,0.3);
  box-shadow: 0 0 40px rgba(0,255,255,0.2);
  animation: pulse 2s infinite;
}

.reactor::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 140px;
  height: 140px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,255,255,0.4), transparent 70%);
  animation: corePulse 1.5s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px rgba(0,255,255,0.2); }
  50% { box-shadow: 0 0 60px rgba(0,255,255,0.4); }
  100% { box-shadow: 0 0 20px rgba(0,255,255,0.2); }
}

@keyframes corePulse {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
}

/* 💬 CHAT */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  z-index: 2;
}

.mensaje {
  max-width: 70%;
  padding: 10px;
  margin: 8px;
  border-radius: 15px;
}

.usuario {
  background: #00ffff;
  color: black;
  align-self: flex-end;
}

.ia {
  border: 1px solid #00ffff;
  align-self: flex-start;
}

/* ⌨️ INPUT */
.input-container {
  display: flex;
  padding: 10px;
  background: rgba(0,0,0,0.6);
  z-index: 2;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  border-radius: 50%;
  background: #00ffff;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 🌐 FONDO -->
<div class="bg"></div>
<div class="reactor"></div>

<div class="chat-container" id="chat"></div>

<div class="input-container">
  <input id="input" type="text" placeholder="Hable, señor..." />
  <button onclick="enviar()">➤</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function escribirTexto(elemento, texto, velocidad = 15) {
  let i = 0;
  const interval = setInterval(() => {
    elemento.textContent += texto.charAt(i);
    i++;
    chat.scrollTop = chat.scrollHeight;
    if (i >= texto.length) clearInterval(interval);
  }, velocidad);
}

function agregarMensaje(texto, tipo, animado=false){
  const div = document.createElement("div");
  div.classList.add("mensaje", tipo);

  if(animado && tipo==="ia"){
    div.textContent="";
    chat.appendChild(div);
    escribirTexto(div, texto);
  } else {
    div.textContent = texto;
    chat.appendChild(div);
  }

  chat.scrollTop = chat.scrollHeight;
}

async function enviar(){
  const mensaje = input.value.trim();
  if(!mensaje) return;

  agregarMensaje(mensaje, "usuario");
  input.value="";

  const res = await fetch("/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({message: mensaje})
  });

  const data = await res.json();

  if(data.reply){
    agregarMensaje(data.reply, "ia", true);
  }
}
</script>

</body>
</html>
