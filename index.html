<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #00ffff;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 🌐 FONDO */
.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background: radial-gradient(circle at center, #001a2a, #000 70%);
}

/* 🔵 REACTOR CENTRAL */
.reactor {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 220px;
  height: 220px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 2px solid rgba(0,255,255,0.3);
  animation: pulse 2s infinite;
}

.reactor::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 140px;
  height: 140px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,255,255,0.4), transparent 70%);
  animation: corePulse 1.5s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px rgba(0,255,255,0.2); }
  50% { box-shadow: 0 0 60px rgba(0,255,255,0.4); }
  100% { box-shadow: 0 0 20px rgba(0,255,255,0.2); }
}

@keyframes corePulse {
  0% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.2); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

/* 🧠 HEADER J.A.R.V.I.S */
.header {
  text-align: center;
  padding: 15px;
  font-size: 20px;
  letter-spacing: 6px;
  font-weight: bold;

  /* efecto metálico */
  background: linear-gradient(90deg, #8aa0b3, #00bcd4, #8aa0b3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow: 0 0 10px rgba(0,255,255,0.3);
}

/* 💬 CHAT */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  z-index: 2;
}

.mensaje {
  max-width: 75%;
  padding: 10px;
  margin: 8px;
  border-radius: 15px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

/* usuario */
.usuario {
  background: #00ffff;
  color: black;
  align-self: flex-end;
}

/* IA estilo perfil */
.ia {
  border: 1px solid #00ffff;
  align-self: flex-start;
}

/* 🔺 icono reactor IA */
.icono {
  width: 12px;
  height: 12px;
  background: #00ffff;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  margin-top: 4px;
  box-shadow: 0 0 8px #00ffff;
}

/* texto */
.texto {
  flex: 1;
}

/* INPUT */
.input-container {
  display: flex;
  padding: 10px;
  background: rgba(0,0,0,0.6);
  z-index: 2;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  border-radius: 50%;
  background: #00ffff;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="reactor"></div>

<!-- 🧠 TITULO -->
<div class="header">J.A.R.V.I.S.</div>

<div class="chat-container" id="chat"></div>

<div class="input-container">
  <input id="input" type="text" placeholder="Hable, señor..." />
  <button onclick="enviar()">➤</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function escribirTexto(el, texto, speed=15){
  let i=0;
  const t=setInterval(()=>{
    el.textContent += texto[i];
    i++;
    chat.scrollTop = chat.scrollHeight;
    if(i>=texto.length) clearInterval(t);
  },speed);
}

function agregarMensaje(texto, tipo, animado=false){

  const cont = document.createElement("div");
  cont.classList.add("mensaje", tipo);

  if(tipo === "ia"){
    const icono = document.createElement("div");
    icono.classList.add("icono");

    const textoDiv = document.createElement("div");
    textoDiv.classList.add("texto");

    cont.appendChild(icono);
    cont.appendChild(textoDiv);

    chat.appendChild(cont);

    if(animado){
      escribirTexto(textoDiv, texto);
    } else {
      textoDiv.textContent = texto;
    }

  } else {
    cont.textContent = texto;
    chat.appendChild(cont);
  }

  chat.scrollTop = chat.scrollHeight;
}

async function enviar(){
  const msg = input.value.trim();
  if(!msg) return;

  agregarMensaje(msg, "usuario");
  input.value="";

  const res = await fetch("/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({message: msg})
  });

  const data = await res.json();

  if(data.reply){
    agregarMensaje(data.reply, "ia", true);
  }
}
</script>

</body>
</html>
