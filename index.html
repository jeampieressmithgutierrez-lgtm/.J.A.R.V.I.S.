<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>

/* VARIABLES JARVIS */
:root {
    --azul-1: #02080f;
    --azul-2: #061a2b;
    --azul-3: #0d2f4f;
    --azul-brillo: #3cc2ff;
    --texto: #d9f3ff;
}

/* FONDO GENERAL (REACTOR SUAVE ANIMADO) */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at center, #0d2f4f 0%, #02080f 70%);
    color: var(--texto);
    overflow: hidden;
}

/* EFECTO REACTOR */
body::before {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(60,194,255,0.4), transparent 70%);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: pulse 3s infinite ease-in-out;
    z-index: 0;
}

@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
}

/* CONTENEDOR */
.container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

/* HEADER */
h1 {
    text-align: center;
    letter-spacing: 2px;
    color: var(--azul-brillo);
    text-shadow: 0 0 15px rgba(60,194,255,0.6);
}

/* CHAT (SIN CAJA FEA) */
#chat {
    height: 75vh;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
}

/* MENSAJES */
.message {
    margin: 8px 0;
    padding: 12px;
    border-radius: 12px;
    max-width: 75%;
    line-height: 1.4;
    animation: fadeIn 0.3s ease;
}

/* USUARIO */
.user {
    background: linear-gradient(145deg, #0d2f4f, #123a6b);
    align-self: flex-end;
    box-shadow: 0 0 10px rgba(60,194,255,0.3);
}

/* JARVIS */
.bot {
    background: rgba(60,194,255,0.08);
    border-left: 3px solid var(--azul-brillo);
    align-self: flex-start;
}

/* INPUT */
.input-area {
    display: flex;
    margin-top: 10px;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #0d2f4f;
    outline: none;
    font-size: 16px;
    background: #061a2b;
    color: var(--texto);
}

/* BOTÓN */
button {
    padding: 12px 18px;
    background: linear-gradient(145deg, #123a6b, #0d2f4f);
    border: 1px solid var(--azul-brillo);
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

/* HOVER */
button:hover {
    box-shadow: 0 0 12px var(--azul-brillo);
}

/* ANIMACIÓN MENSAJES */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

/* 📱 MÓVIL */
@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    h1 {
        font-size: 18px;
    }

    #chat {
        height: 78vh;
    }

    .message {
        max-width: 90%;
        font-size: 15px;
    }

    input {
        font-size: 15px;
        padding: 10px;
    }

    button {
        padding: 10px;
    }
}

</style>
</head>

<body>

<div class="container">
    <h1>J.A.R.V.I.S</h1>

    <div id="chat"></div>

    <div class="input-area">
        <input id="input" placeholder="Hable, señor...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const message = input.value.trim();
    if (!message) return;

    // Usuario
    chat.innerHTML += `<div class="message user">${message}</div>`;
    input.value = "";

    chat.scrollTop = chat.scrollHeight;

    // Indicador escribiendo
    const typing = document.createElement("div");
    typing.className = "message bot";
    typing.id = "typing";
    typing.innerText = "Procesando...";
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message})
    });

    const data = await response.json();

    // Quitar "Procesando"
    typing.remove();

    // JARVIS responde
    chat.innerHTML += `<div class="message bot">${data.reply}</div>`;
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
