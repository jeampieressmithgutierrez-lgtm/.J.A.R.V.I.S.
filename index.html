<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
:root {
  --core: #ffae00;
  --glow: #ff6a00;
  --energy: #ffd000;
  --deep: #ff4500;
  --bg: #050505;
}

body {
  margin: 0;
  background: radial-gradient(circle, #000000, #050505);
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
}

/* CONTENEDOR PRINCIPAL */
.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  justify-content: space-between;
  align-items: center;
}

/* HEADER */
.header {
  width: 100%;
  text-align: center;
  padding: 15px;
  font-size: 28px;
  color: var(--energy);
  text-shadow: 0 0 20px var(--glow);
}

/* CHAT */
.chat {
  width: 90%;
  max-width: 500px;
  height: 40%;
  overflow-y: auto;
}

.message {
  margin: 10px;
  padding: 10px;
  border-radius: 10px;
}

.user {
  background: rgba(255, 170, 0, 0.2);
  text-align: right;
}

.bot {
  background: rgba(255, 200, 0, 0.1);
}

/* INPUT */
.input-area {
  display: flex;
  width: 90%;
  max-width: 500px;
  margin-bottom: 20px;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
  background: black;
  color: var(--energy);
}

button {
  padding: 10px 20px;
  background: var(--core);
  border: none;
  color: black;
  cursor: pointer;
}

/* JARVIS CORE */
.jarvis-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin: auto;
}

/* NUCLEO */
.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffd000 0%, #ff6a00 50%, #000 100%);
  box-shadow:
    0 0 30px #ffae00,
    0 0 60px #ff6a00,
    0 0 100px #ff4500;
  animation: pulse 2s infinite;
}

/* ANILLOS */
.ring {
  position: absolute;
  top: 50%;
  left: 50%;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid rgba(255,170,0,0.3);
  box-shadow: 0 0 20px var(--core);
}

.ring1 {
  width: 200px;
  height: 200px;
  animation: rotate 10s linear infinite;
}

.ring2 {
  width: 260px;
  height: 260px;
  animation: rotate 15s linear infinite reverse;
}

.ring3 {
  width: 320px;
  height: 320px;
  animation: rotate 20s linear infinite;
}

/* ANIMACIONES */
@keyframes rotate {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

@keyframes pulse {
  0%,100% {
    transform: translate(-50%, -50%) scale(1);
  }
  50% {
    transform: translate(-50%, -50%) scale(1.15);
  }
}

</style>
</head>

<body>

<div class="container">

  <div class="header">JARVIS AI</div>

  <!-- ALMA DE JARVIS -->
  <div class="jarvis-container">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="core"></div>
  </div>

  <!-- CHAT -->
  <div class="chat" id="chat"></div>

  <!-- INPUT -->
  <div class="input-area">
    <input id="input" placeholder="Hable, señor...">
    <button onclick="sendMessage()">➤</button>
  </div>

</div>

<script>
function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  if (input.value.trim() === "") return;

  // Mensaje usuario
  const userMsg = document.createElement("div");
  userMsg.className = "message user";
  userMsg.innerText = input.value;
  chat.appendChild(userMsg);

  // Respuesta fake Jarvis
  const botMsg = document.createElement("div");
  botMsg.className = "message bot";
  botMsg.innerText = "Procesando solicitud, Señor...";
  
  setTimeout(() => {
    botMsg.innerText = "Respuesta generada correctamente.";
  }, 1000);

  chat.appendChild(botMsg);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
