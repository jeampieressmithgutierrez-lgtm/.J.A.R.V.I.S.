<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>

/* 🔵 FONDO ARC REACTOR */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: #00eaff;
    background: radial-gradient(circle at center, #001a2e, #000);
    overflow: hidden;
}

/* 🔵 ANIMACIÓN ENERGÍA */
body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0,234,255,0.4), transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: pulse 4s infinite;
    filter: blur(40px);
}

@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); }
}

/* CONTENEDOR */
.container {
    position: relative;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    z-index: 2;
}

/* TÍTULO */
h1 {
    text-align: center;
    letter-spacing: 3px;
    color: #00eaff;
    text-shadow: 0 0 20px #00eaff;
}

/* CHAT */
#chat {
    height: 65vh;
    overflow-y: auto;
    padding: 20px;
    border-radius: 20px;
    background: rgba(0, 20, 40, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0,234,255,0.2);
    box-shadow: 0 0 30px rgba(0,234,255,0.2);
}

/* MENSAJES */
.message {
    margin: 15px 0;
    padding: 15px;
    border-radius: 15px;
    max-width: 75%;
    animation: fadeIn 0.3s ease;
}

/* BOT */
.bot {
    background: rgba(0,234,255,0.1);
    border-left: 3px solid #00eaff;
}

/* USER */
.user {
    background: #00eaff;
    color: #000;
    margin-left: auto;
}

/* INPUT */
.input-area {
    display: flex;
    margin-top: 15px;
    gap: 10px;
}

input {
    flex: 1;
    padding: 15px;
    border-radius: 12px;
    border: none;
    outline: none;
    background: rgba(0,20,40,0.7);
    color: #00eaff;
    font-size: 16px;
    box-shadow: 0 0 15px rgba(0,234,255,0.2);
}

/* BOTÓN */
button {
    padding: 15px 20px;
    background: #00eaff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    box-shadow: 0 0 20px #00eaff;
}

/* ANIMACIONES */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

/* SCROLL */
#chat::-webkit-scrollbar {
    width: 5px;
}

#chat::-webkit-scrollbar-thumb {
    background: #00eaff;
}

/* 📱 MÓVIL */
@media (max-width: 600px) {
    #chat { height: 70vh; }
    input { font-size: 14px; }
}

</style>
</head>

<body>

<div class="container">
    <h1>JARVIS AI</h1>

    <div id="chat"></div>

    <div class="input-area">
        <input id="input" placeholder="Hable, señor...">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>

/* ✨ EFECTO ESCRITURA */
function typeWriter(element, text, speed = 15) {
    let i = 0;
    function typing() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

async function sendMessage() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const message = input.value.trim();
    if (!message) return;

    chat.innerHTML += `<div class="message user">${message}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message})
    });

    const data = await response.json();

    const botDiv = document.createElement("div");
    botDiv.className = "message bot";
    chat.appendChild(botDiv);

    typeWriter(botDiv, data.reply);

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
