<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at center, #02050a, #000);
  color: #00eaff;
  overflow: hidden;
}

/* CONTENEDOR */
.container {
  width: 900px;
  height: 90vh;
  margin: auto;
  margin-top: 3vh;
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 15px;
  box-shadow: 0 0 30px rgba(0,255,255,0.2);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(10px);
  background: rgba(0,10,20,0.6);
}

/* HEADER */
.header {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  letter-spacing: 6px;
  font-weight: bold;
  color: #cfefff;
  text-shadow: 0 0 10px #00eaff;
}

/* CHAT */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* MENSAJES */
.mensaje {
  max-width: 60%;
  padding: 12px;
  margin: 10px;
  border-radius: 10px;
  position: relative;
  white-space: pre-wrap;
}

/* USUARIO */
.usuario {
  margin-left: auto;
  background: rgba(0,255,255,0.1);
  border: 1px solid #00eaff;
}

/* IA */
.ia {
  background: rgba(0,100,255,0.1);
  border: 1px solid #00eaff;
}

/* INPUT */
.input-area {
  display: flex;
  padding: 10px;
  border-top: 1px solid rgba(0,255,255,0.2);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #02131f;
  color: #00eaff;
}

button {
  margin-left: 10px;
  border: none;
  border-radius: 50%;
  padding: 12px;
  background: #00eaff;
  cursor: pointer;
}

/* GRID */
.background-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(#00eaff22 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: -1;
}

/* ========================= */
/* REACTOR ARC MEJORADO */
/* ========================= */

.reactor {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  height: 220px;
}

/* NÚCLEO INTENSO */
.reactor::before {
  content: "";
  position: absolute;
  width: 90px;
  height: 90px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, #ffffff, #00eaff, #0088ff, transparent);
  border-radius: 50%;
  box-shadow:
    0 0 25px #00eaff,
    0 0 60px #0088ff,
    0 0 100px #00eaff;
  animation: pulseCore 1.6s infinite ease-in-out;
}

/* ANILLO EXTERNO */
.reactor::after {
  content: "";
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  top: 10px;
  left: 10px;
  border: 2px solid rgba(0,234,255,0.3);
  box-shadow:
    0 0 15px #00eaff inset,
    0 0 30px #00eaff;
  animation: rotate 8s linear infinite;
}

/* ANILLO INTERNO */
.ring {
  position: absolute;
  width: 150px;
  height: 150px;
  top: 35px;
  left: 35px;
  border-radius: 50%;
  border: 2px dashed rgba(0,234,255,0.7);
  animation: rotateReverse 5s linear infinite;
}

/* SEGUNDO ANILLO (NUEVO) */
.ring2 {
  position: absolute;
  width: 120px;
  height: 120px;
  top: 50px;
  left: 50px;
  border-radius: 50%;
  border: 1px solid rgba(0,234,255,0.5);
  box-shadow: 0 0 10px #00eaff;
  animation: rotate 3s linear infinite;
}

/* LÍNEAS ENERGÍA */
.lines {
  position: absolute;
  width: 100%;
  height: 100%;
}

.lines span {
  position: absolute;
  width: 3px;
  height: 25px;
  background: #00eaff;
  top: 0;
  left: 50%;
  transform-origin: bottom center;
  box-shadow: 0 0 10px #00eaff;
}

.lines span:nth-child(1){transform:rotate(0deg) translateX(-50%)}
.lines span:nth-child(2){transform:rotate(45deg) translateX(-50%)}
.lines span:nth-child(3){transform:rotate(90deg) translateX(-50%)}
.lines span:nth-child(4){transform:rotate(135deg) translateX(-50%)}
.lines span:nth-child(5){transform:rotate(180deg) translateX(-50%)}
.lines span:nth-child(6){transform:rotate(225deg) translateX(-50%)}
.lines span:nth-child(7){transform:rotate(270deg) translateX(-50%)}
.lines span:nth-child(8){transform:rotate(315deg) translateX(-50%)}

/* ANIMACIONES */
@keyframes pulseCore {
  0%,100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.3); }
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}

/* ESCRITURA */
.typing::after {
  content: "▋";
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,100% { opacity: 0; }
  50% { opacity: 1; }
}
</style>
</head>

<body>

<div class="background-grid"></div>

<div class="container">
  <div class="header">J.A.R.V.I.S</div>
  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Hable, señor...">
    <button onclick="enviar()">➤</button>
  </div>
</div>

<!-- REACTOR -->
<div class="reactor">
  <div class="ring"></div>
  <div class="ring2"></div>
  <div class="lines">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

let enviando = false;

function agregarMensaje(texto, tipo) {
  const div = document.createElement("div");
  div.classList.add("mensaje", tipo);
  div.innerText = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escribirTexto(elemento, texto, velocidad = 20) {
  elemento.innerText = "";
  elemento.classList.add("typing");

  let i = 0;
  function escribir() {
    if (i < texto.length) {
      elemento.innerText += texto.charAt(i);
      i++;
      setTimeout(escribir, velocidad);
    } else {
      elemento.classList.remove("typing");
    }
  }
  escribir();
}

async function enviar() {
  if (enviando) return;
  enviando = true;

  const mensaje = input.value.trim();
  if (!mensaje) {
    enviando = false;
    return;
  }

  agregarMensaje(mensaje, "usuario");
  input.value = "";

  const mensajeIA = agregarMensaje("", "ia");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: mensaje })
    });

    const data = await res.json();
    const texto = data.reply || "Sin respuesta.";

    escribirTexto(mensajeIA, texto);

  } catch {
    mensajeIA.innerText = "Error de conexión.";
  }

  enviando = false;
}

input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") enviar();
});
</script>

</body>
</html>
